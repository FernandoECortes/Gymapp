<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Routine Pro Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 90px; /* Espacio para el timer flotante */
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--accent); }
        .btn-success:hover { background-color: var(--accent-hover); }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-warning:hover { background-color: #d97706; }

        .btn-sm { padding: 6px 10px; font-size: 0.85rem; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        /* Rutinas y Ejercicios */
        .routine-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .routine-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .routine-title { font-size: 1.2rem; font-weight: bold; }
        .exercise-list { list-style: none; border-top: 1px solid var(--border); padding-top: 10px; }
        .exercise-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }
        .badge {
            background-color: #334155;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 8px;
        }

        /* Panel de Cronómetro Flotante */
        .timer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0f172a;
            border-top: 2px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .timer-display { font-size: 1.3rem; font-weight: bold; font-family: monospace; color: var(--accent); }

        /* Modo entrenamiento activo */
        .active-workout-card { border: 2px solid var(--accent); }
        .set-checkbox { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }

        .hidden { display: none !important; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💪 Gym Routine Pro</h1>
            <div>
                <button class="btn btn-warning btn-sm" id="history-view-btn" onclick="toggleHistoryView()">Historial</button>
                <button class="btn" id="toggle-form-btn">+ Nueva Rutina</button>
            </div>
        </header>

        <!-- Formulario para crear/editar rutina -->
        <div class="card hidden" id="routine-form-card">
            <h3 id="form-title" style="margin-bottom: 15px;">Crear Nueva Rutina</h3>
            <form id="routine-form">
                <input type="hidden" id="routine-id">
                <div class="form-group">
                    <label for="routine-name">Nombre de la Rutina (Ej: Día A - Tren Superior)</label>
                    <input type="text" id="routine-name" required placeholder="Ej: Espalda / Bíceps">
                </div>

                <div id="exercises-container">
                    <label>Ejercicios</label>
                </div>

                <button type="button" class="btn btn-sm btn-success" id="add-exercise-btn" style="margin-bottom: 15px;">+ Agregar Ejercicio</button>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn">Guardar Rutina</button>
                    <button type="button" class="btn btn-danger" id="cancel-form-btn">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Vista de Historial -->
        <div class="card hidden" id="history-card">
            <h3 style="margin-bottom: 15px;">📈 Historial de Entrenamientos</h3>
            <div id="history-list"></div>
            <button class="btn btn-sm btn-danger" onclick="toggleHistoryView()" style="margin-top: 15px;">Cerrar Historial</button>
        </div>

        <!-- Listado de Rutinas / Modo Activo -->
        <div id="main-view">
            <div id="routines-list"></div>
        </div>
    </div>

    <!-- Barra de Cronómetro Global -->
    <div class="timer-bar">
        <span>⏱️ Descanso:</span>
        <span class="timer-display" id="timer-display">00:00</span>
        <button class="btn btn-sm" onclick="startTimer(60)">60s</button>
        <button class="btn btn-sm" onclick="startTimer(90)">90s</button>
        <button class="btn btn-sm" onclick="startTimer(120)">120s</button>
        <button class="btn btn-danger btn-sm" onclick="stopTimer()">Parar</button>
    </div>

    <script>
        let routines = JSON.parse(localStorage.getItem('gym_routines')) || [];
        let historyLog = JSON.parse(localStorage.getItem('gym_history')) || [];
        
        let activeWorkout = null; // Guardará los datos de la sesión en curso
        let timerInterval = null;
        let timeLeft = 0;

        const toggleFormBtn = document.getElementById('toggle-form-btn');
        const routineFormCard = document.getElementById('routine-form-card');
        const routineForm = document.getElementById('routine-form');
        const cancelFormBtn = document.getElementById('cancel-form-btn');
        const addExerciseBtn = document.getElementById('add-exercise-btn');
        const exercisesContainer = document.getElementById('exercises-container');
        const routinesList = document.getElementById('routines-list');
        const formTitle = document.getElementById('form-title');
        const routineIdInput = document.getElementById('routine-id');
        const routineNameInput = document.getElementById('routine-name');
        const historyCard = document.getElementById('history-card');
        const historyList = document.getElementById('history-list');

        toggleFormBtn.addEventListener('click', () => openForm());
        cancelFormBtn.addEventListener('click', () => closeForm());
        addExerciseBtn.addEventListener('click', () => addExerciseRow());
        routineForm.addEventListener('submit', saveRoutine);

        renderRoutines();

        function openForm(routine = null) {
            routineFormCard.classList.remove('hidden');
            toggleFormBtn.classList.add('hidden');
            exercisesContainer.innerHTML = '';

            if (routine) {
                formTitle.textContent = 'Editar Rutina';
                routineIdInput.value = routine.id;
                routineNameInput.value = routine.name;
                routine.exercises.forEach(ex => addExerciseRow(ex));
            } else {
                formTitle.textContent = 'Crear Nueva Rutina';
                routineIdInput.value = '';
                routineNameInput.value = '';
                addExerciseRow();
            }
        }

        function closeForm() {
            routineFormCard.classList.add('hidden');
            toggleFormBtn.classList.remove('hidden');
            routineForm.reset();
        }

        function addExerciseRow(data = { name: '', reps: '', weight: '', muscle: 'Pecho' }) {
            const row = document.createElement('div');
            row.classList.add('form-row');
            row.innerHTML = `
                <input type="text" placeholder="Ejercicio (Ej: Press Banca)" class="ex-name" value="${data.name}" required>
                <input type="text" placeholder="Series/Reps (Ej: 4x10)" class="ex-reps" value="${data.reps}" required>
                <input type="text" placeholder="Peso (Ej: 60 kg)" class="ex-weight" value="${data.weight}" required>
                <select class="ex-muscle">
                    <option value="Pecho" ${data.muscle==='Pecho'?'selected':''}>Pecho</option>
                    <option value="Espalda" ${data.muscle==='Espalda'?'selected':''}>Espalda</option>
                    <option value="Piernas" ${data.muscle==='Piernas'?'selected':''}>Piernas</option>
                    <option value="Hombros" ${data.muscle==='Hombros'?'selected':''}>Hombros</option>
                    <option value="Brazos" ${data.muscle==='Brazos'?'selected':''}>Brazos</option>
                    <option value="Core" ${data.muscle==='Core'?'selected':''}>Core</option>
                </select>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">X</button>
            `;
            exercisesContainer.appendChild(row);
        }

        function saveRoutine(e) {
            e.preventDefault();
            const id = routineIdInput.value ? Number(routineIdInput.value) : Date.now();
            const name = routineNameInput.value.trim();
            
            const exerciseRows = exercisesContainer.querySelectorAll('.form-row');
            const exercises = [];

            exerciseRows.forEach(row => {
                exercises.push({
                    name: row.querySelector('.ex-name').value,
                    reps: row.querySelector('.ex-reps').value,
                    weight: row.querySelector('.ex-weight').value,
                    muscle: row.querySelector('.ex-muscle').value
                });
            });

            if (exercises.length === 0) {
                alert('Agregá al menos un ejercicio.');
                return;
            }

            const routineData = { id, name, exercises };
            const index = routines.findIndex(r => r.id === id);
            if (index >= 0) routines[index] = routineData;
            else routines.push(routineData);

            localStorage.setItem('gym_routines', JSON.stringify(routines));
            closeForm();
            renderRoutines();
        }

        function renderRoutines() {
            if (activeWorkout) return; // Si estamos entrenando, no redibujar la lista estática

            if (routines.length === 0) {
                routinesList.innerHTML = `<div class="empty-state">No tenés rutinas guardadas todavía. ¡Crea una para empezar!</div>`;
                return;
            }

            routinesList.innerHTML = '';
            routines.forEach(routine => {
                const item = document.createElement('div');
                item.classList.add('routine-item');
                
                let exercisesHTML = '';
                routine.exercises.forEach(ex => {
                    exercisesHTML += `
                        <li class="exercise-row">
                            <span><strong>${ex.name}</strong> <span class="badge">${ex.muscle}</span></span>
                            <span style="color: var(--text-muted);">Meta: <strong>${ex.reps}</strong> | Último: <strong>${ex.weight}</strong></span>
                        </li>
                    `;
                });

                item.innerHTML = `
                    <div class="routine-header">
                        <span class="routine-title">${routine.name}</span>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-success btn-sm" onclick="startWorkout(${routine.id})">▶️ Entrenar</button>
                            <button class="btn btn-sm" onclick="editRoutine(${routine.id})">Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRoutine(${routine.id})">Eliminar</button>
                        </div>
                    </div>
                    <ul class="exercise-list">${exercisesHTML}</ul>
                `;
                routinesList.appendChild(item);
            });
        }

        /* --- MODO ENTRENAMIENTO EN VIVO --- */
        function startWorkout(id) {
            const routine = routines.find(r => r.id === id);
            if (!routine) return;

            activeWorkout = {
                routineName: routine.name,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                exercises: routine.exercises.map(ex => ({ ...ex, loggedWeight: ex.weight }))
            };

            renderActiveWorkout();
        }

        function renderActiveWorkout() {
            toggleFormBtn.classList.add('hidden');
            routinesList.innerHTML = `
                <div class="card active-workout-card">
                    <h2 style="color: var(--accent); margin-bottom: 5px;">🔥 Entrenando: ${activeWorkout.routineName}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">Marcá tus series completadas y ajustá el peso real utilizado hoy.</p>
                    
                    ${activeWorkout.exercises.map((ex, idx) => `
                        <div style="background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border);">
                            <div style="font-weight: bold; margin-bottom: 6px;">${ex.name} <span class="badge">${ex.muscle}</span></div>
                            <div style="display: flex; gap: 10px; align-items: center; font-size: 0.9rem; color: var(--text-muted);">
                                <span>Meta: ${ex.reps}</span>
                                <div style="flex-grow: 1;">
                                    <input type="text" value="${ex.loggedWeight}" id="weight-${idx}" style="padding: 6px; font-size: 0.9rem;" placeholder="Peso real hoy">
                                </div>
                                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-color);">
                                    <input type="checkbox" class="set-checkbox"> Hecho
                                </label>
                            </div>
                        </div>
                    `).join('')}

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn btn-success" onclick="finishWorkout()">🏁 Finalizar y Guardar Sesión</button>
                        <button class="btn btn-danger" onclick="cancelWorkout()">Cancelar</button>
                    </div>
                </div>
            `;
        }

        function finishWorkout() {
            // Actualizar pesos reales en la rutina base si el usuario los cambió
            activeWorkout.exercises.forEach((ex, idx) => {
                const newWeightInput = document.getElementById(`weight-${idx}`);
                if (newWeightInput) {
                    ex.loggedWeight = newWeightInput.value;
                }
            });

            // Guardar en historial
            historyLog.unshift(activeWorkout);
            localStorage.setItem('gym_history', JSON.stringify(historyLog));

            // Actualizar pesos en la rutina principal
            const routine = routines.find(r => r.name === activeWorkout.routineName);
            if (routine) {
                routine.exercises.forEach((ex, idx) => {
                    ex.weight = activeWorkout.exercises[idx].loggedWeight;
                });
                localStorage.setItem('gym_routines', JSON.stringify(routines));
            }

            activeWorkout = null;
            toggleFormBtn.classList.remove('hidden');
            renderRoutines();
            alert('¡Entrenamiento guardado con éxito! 💪');
        }

        function cancelWorkout() {
            if (confirm('¿Seguro que querés cancelar la sesión actual?')) {
                activeWorkout = null;
                toggleFormBtn.classList.remove('hidden');
                renderRoutines();
            }
        }

        /* --- CRONÓMETRO DE DESCANSO --- */
        function startTimer(seconds) {
            clearInterval(timerInterval);
            timeLeft = seconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('¡Tiempo de descanso terminado! A por la siguiente serie 🔥');
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timeLeft = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer-display').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        /* --- HISTORIAL --- */
        function toggleHistoryView() {
            historyCard.classList.toggle('hidden');
            document.getElementById('main-view').classList.toggle('hidden');
            
            if (!historyCard.classList.contains('hidden')) {
                renderHistory();
            }
        }

        function renderHistory() {
            if (historyLog.length === 0) {
                historyList.innerHTML = `<div class="empty-state">No hay entrenamientos registrados todavía.</div>`;
                return;
            }

            historyList.innerHTML = historyLog.map(session => `
                <div style="background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border);">
                    <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: var(--primary);">
                        <span>${session.routineName}</span>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">${session.date}</span>
                    </div>
                    <ul style="list-style: none; font-size: 0.9rem; color: var(--text-muted);">
                        ${session.exercises.map(ex => `<li>• ${ex.name}: <strong>${ex.loggedWeight}</strong> (Meta:${ex.reps})</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function editRoutine(id) {
            const routine = routines.find(r => r.id === id);
            if (routine) openForm(routine);
        }

        function deleteRoutine(
